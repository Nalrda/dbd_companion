<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Prevent browser from caching this page so users always get the latest build -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dbd_companion">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DBD Companion</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#1a1a1f;margin:0;">
  <div id="loading" style="
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;min-height:100vh;
      font-family:sans-serif;color:#888;gap:12px;">
    <div style="
        width:36px;height:36px;border:3px solid #333;
        border-top-color:#e53935;border-radius:50%;
        animation:spin 0.8s linear infinite;"></div>
    <span style="font-size:14px;letter-spacing:0.05em;">DBD Companion</span>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script>
    // When the page becomes visible again (tab switch / return from background),
    // check if a new service worker is waiting and, if so, reload.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        window.location.reload();
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update();
          });
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
